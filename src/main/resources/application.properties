# File-backed H2. Override with TRAVEL_DB_URL (e.g. a Postgres URL) -- no key/credential is committed.
spring.datasource.url=${TRAVEL_DB_URL:jdbc:h2:file:./data/travel;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${TRAVEL_DB_USER:sa}
spring.datasource.password=${TRAVEL_DB_PASSWORD:}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.use-big-decimal-for-floats=true
spring.jackson.default-property-inclusion=non_null

server.port=${PORT:8080}
spring.main.banner-mode=off
